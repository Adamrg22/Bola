name: Build Anime Orb Arena APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: actions/setup-android@v3
        with:
          api-level: 33
          ndk-version: '25.1.8937393'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Install Node.js dependencies
        run: npm install

      - name: Sync web assets with Android
        run: npx cap copy android

      - name: Grant execution permissions for gradlew
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stop

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-orb-arena-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30